# Shops, food and other commercial floor space.
type: retail
label: Retail and food
description: >-
  Retail and commercial floor space: shopping centres, shops, grocery stores,
  food halls, restaurants, retail podiums under towers.
geometry: polygon
draw:
  tools: [lot, rectangle, polygon, freehand]
  min_area_m2: 200
  max_area_m2: 200000
params:
  height_m:
    label: Height
    unit: m
    default: 20
    min: 5
    max: 60
    step: 1
    main: true
render:
  kind: extrusion
  height_param: height_m
  color: proposalRetail
impact_radius_m: 500
storey_m: 5
zone_classes:
  - commercial residential
  - commercial residential employment
  - commercial local
impact_metrics:
  - replaced
  - site
  - zoning_fit
  - height_context
  - transit
  - retail_nearby
  - population
  - floor_area
relevant_to:
  - residents
  - local_business
  - workers
  - commuters
default_subtype: mall
subtypes:
  mall:
    label: Mall
    description: An enclosed shopping centre.
  grocery_store:
    label: Grocery store
    defaults:
      height_m: 6
  shops:
    label: Shops
    description: Street-front stores.
    defaults:
      height_m: 6
  food_hall:
    label: Food hall
    defaults:
      height_m: 8
  restaurant:
    label: Restaurant
    defaults:
      height_m: 6
